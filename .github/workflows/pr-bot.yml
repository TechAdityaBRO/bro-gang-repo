name: pr-bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install deps
        run: npm install smol-toml

      - name: Validate manifests
        id: validate
        run: node .github/scripts/validate-pr.js

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.validate.outcome }}' === 'success';
            const body = ok
              ? '✅ **Bro Gang PR bot**: all manifests valid, hashes verified, index updated. Merging automatically.'
              : '❌ **Bro Gang PR bot**: validation failed. See the Actions log for details. Fix the PR and push again.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Auto-merge
        if: steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
            });
